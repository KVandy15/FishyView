[project]
name = "fishyview"
version = "0.1.0"
description = "Player for circular fisheye video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Korey Vandewalker" }]
dependencies = [
  "av>=14",
  "moderngl>=5.12",
  "numpy",
  "pygame>=2.6",
]

[project.scripts]
fishyview = "fishyview.player:main"

[tool.pyinstaller]
# Built with build.ps1. PyInstaller is a dev tool, not a runtime dependency.
